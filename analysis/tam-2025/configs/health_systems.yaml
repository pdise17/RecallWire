# Health Systems Pattern Matching Configuration
# Defines identification patterns for US health systems
#
# Pattern Matching Rules:
# 1. Check exclude_patterns first (if match, skip this system)
# 2. Check state_patterns for hospital's state (more precise)
# 3. Check general patterns (broader match)
#
# Pattern Syntax: Python regex (case-insensitive)
# - Use \b for word boundaries
# - Use .* for wildcards
# - Use (?!...) for negative lookahead
#

