<!DOCTYPE html>
<!--
  RecallWire LinkedIn Banner (Simple Version)
  Dimensions: 1128 x 191 pixels (LinkedIn Company Page)

  Design: Centered logo + tagline with large navy border for safe cropping
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecallWire LinkedIn Banner - Simple</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f0f0f0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .banner {
      width: 1128px;
      height: 191px;
      background: #1E3A5F;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 80px;
      position: relative;
    }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      background: linear-gradient(135deg, #1E3A5F 0%, #2A4A73 50%, #1E3A5F 100%);
      padding: 25px 60px;
      border-radius: 8px;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 300;
      color: white;
      line-height: 0.95;
      letter-spacing: 7px;
    }

    .logo-text .line1,
    .logo-text .line2 {
      display: block;
    }

    .logo-text .line2 {
      margin-left: 1.5em;
    }

    .logo-text .highlight {
      color: #00B4A0;
    }

    .divider {
      width: 2px;
      height: 70px;
      background: linear-gradient(180deg, transparent 0%, #00B4A0 20%, #00B4A0 80%, transparent 100%);
    }

    .tagline {
      font-size: 28px;
      font-weight: 600;
      color: white;
      line-height: 1.3;
    }

    .tagline .emphasis {
      color: #00B4A0;
    }
  </style>
</head>
<body>
  <div class="label">LinkedIn Company Page Banner - Simple (1128 x 191)</div>

  <div class="banner">
    <div class="content">
      <div class="logo-text">
        <span class="line1">REC<span class="highlight">A</span>LL</span>
        <span class="line2">W<span class="highlight">I</span>RE</span>
      </div>
      <div class="divider"></div>
      <div class="tagline">Respond <span class="emphasis">10x faster</span></div>
    </div>
  </div>

  <div class="label" style="margin-top: 20px;">Large navy border provides safe area for LinkedIn cropping</div>
</body>
</html>
