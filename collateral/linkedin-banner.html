<!DOCTYPE html>
<!--
  RecallWire LinkedIn Banner
  Dimensions: 1128 x 191 pixels (LinkedIn Company Page)

  To export as image:
  1. Open in browser
  2. Take a screenshot of the banner area, or
  3. Use browser dev tools to screenshot the .banner element
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecallWire LinkedIn Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f0f0f0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .banner {
      width: 1128px;
      height: 191px;
      background: linear-gradient(135deg, #1E3A5F 0%, #2A4A73 50%, #1E3A5F 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background pattern */
    .banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(0, 180, 160, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(0, 180, 160, 0.08) 0%, transparent 40%);
      pointer-events: none;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 40px;
      z-index: 1;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 300;
      color: white;
      line-height: 0.95;
      letter-spacing: 6px;
    }

    .logo-text .line1,
    .logo-text .line2 {
      display: block;
    }

    .logo-text .line2 {
      margin-left: 1.5em;
    }

    .logo-text .highlight {
      color: #00B4A0;
    }

    .divider {
      width: 2px;
      height: 80px;
      background: linear-gradient(180deg, transparent 0%, #00B4A0 20%, #00B4A0 80%, transparent 100%);
    }

    .tagline-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tagline {
      font-size: 24px;
      font-weight: 600;
      color: white;
      max-width: 500px;
      line-height: 1.3;
    }

    .tagline .emphasis {
      color: #00B4A0;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 30px;
      z-index: 1;
    }

    .stat-group {
      display: flex;
      gap: 24px;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #00B4A0;
    }

    .stat-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .badge {
      background: #00B4A0;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="label">LinkedIn Company Page Banner (1128 x 191)</div>

  <div class="banner">
    <div class="left-section">
      <div class="logo-text">
        <span class="line1">REC<span class="highlight">A</span>LL</span>
        <span class="line2">W<span class="highlight">I</span>RE</span>
      </div>
      <div class="divider"></div>
      <div class="tagline-section">
        <div class="tagline">Respond to recalls <span class="emphasis">10x faster</span></div>
        <div class="subtitle">AI-Powered Medical Device Recall Management</div>
      </div>
    </div>

    <div class="right-section">
      <div class="stat-group">
        <div class="stat">
          <div class="stat-number">98%</div>
          <div class="stat-label">Noise Reduced</div>
        </div>
        <div class="stat">
          <div class="stat-number">100%</div>
          <div class="stat-label">Audit Trail</div>
        </div>
      </div>
      <div class="badge">Joint Commission<br>Ready</div>
    </div>
  </div>

  <div class="label" style="margin-top: 40px;">Instructions: Open in browser, then screenshot or use dev tools to capture the banner element</div>
</body>
</html>
